[project]
name = "evidrug-deeppurpose-dta-smoke"
version = "0.1.0"
description = "Isolated DeepPurpose CNN-CNN BindingDB CPU feasibility check"
requires-python = ">=3.10,<3.12"
dependencies = [
    "descriptastorus==2.8.0",
    "matplotlib==3.7.5",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "pandas-flavor==0.6.0",
    "prettytable==3.16.0",
    "rdkit-pypi==2022.9.5",
    "requests==2.32.5",
    "scikit-learn==1.2.2",
    "scipy==1.10.1",
    "setuptools==80.9.0",
    "subword-nmt==0.3.8",
    "tensorboard==2.20.0",
    "torch==2.5.1+cpu",
    "tqdm==4.67.1",
    "wheel==0.45.1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
