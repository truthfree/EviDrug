name: Secret scan

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.11'
          cache: false
      - name: Install pinned scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Test guard with synthetic credentials
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Scan complete fetched history
        run: python3 scripts/check_secrets.py history
